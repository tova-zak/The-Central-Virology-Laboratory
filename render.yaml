# Render deployment configuration
# Budget: ₪0 (Free Tier only)

services:
  # Backend API
  - type: web
    name: virology-lab-backend
    env: python
    region: frankfurt  # or oregon, singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: GEMINI_API_KEY
        sync: false  # User must set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: APP_NAME
        value: Virology Lab API
      - key: APP_VERSION
        value: 1.0.0-mvp
      - key: TEMP_STORAGE_PATH
        value: /opt/render/project/src/temp_storage
      - key: CORS_ORIGINS
        value: https://virology-lab-frontend.onrender.com,http://localhost:5173
    healthCheckPath: /health
    autoDeploy: false  # Manual deploy only

  # Frontend (Static Site)
  - type: web
    name: virology-lab-frontend
    env: static
    region: frankfurt
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    routes:
      - type: rewrite
        source: /*
        destination: /index.html  # SPA routing
    envVars:
      - key: VITE_API_URL
        value: https://virology-lab-backend.onrender.com
    autoDeploy: false
