# Protected synthetic demo only. Manual deployment requires approval.
services:
  - type: web
    name: virology-lab-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: integration/final-mvp
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DEPLOYMENT_MODE
        value: cloud
      - key: DEMO_MODE
        value: "true"
      - key: HYBRID_ENGINE_ENABLED
        value: "false"
      - key: HYBRID_ENABLE_PREPROCESSING
        value: "false"
      - key: HYBRID_ENABLE_OCR
        value: "false"
      - key: HYBRID_ENABLE_HYBRID_VERIFICATION
        value: "false"
      - key: HYBRID_ENABLE_FOCUSED_RETRY
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        sync: false
      - key: API_USERNAME
        sync: false
      - key: API_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: virology-lab-frontend
    runtime: static
    branch: integration/final-mvp
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
